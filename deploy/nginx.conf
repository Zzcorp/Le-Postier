# Le Postier — nginx (conteneur nginx du docker-compose).
# TLS Let's Encrypt, médias servis directement depuis le bind /media,
# tout le reste passe à gunicorn (service web:8000).
#
# Premier démarrage : le certificat doit exister avant que nginx accepte de
# charger le bloc 443 — voir DEPLOY_OVH.md §6 (bootstrap TLS).

server_tokens off;

# Compression (html/css/js/svg/json)
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    application/javascript
    text/javascript
    image/svg+xml
    application/json;

upstream lepostier_web {
    server web:8000;
}

# ---------------------------------------------------------------------------
# HTTP : challenge ACME (webroot certbot) + redirection vers HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name collections.samathey.fr www.collections.samathey.fr;

    # Webroot ACME — utilisé par le conteneur certbot pour les renouvellements.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://collections.samathey.fr$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS www → domaine nu (nécessite le certificat étendu aux deux noms,
# voir DEPLOY_OVH.md « Ajouter le sous-domaine www »)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.collections.samathey.fr;

    ssl_certificate     /etc/letsencrypt/live/collections.samathey.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/collections.samathey.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://collections.samathey.fr$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS : le site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name collections.samathey.fr;

    ssl_certificate     /etc/letsencrypt/live/collections.samathey.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/collections.samathey.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gros envois : vidéos ajoutées depuis l'admin. Django ne garde que 10 Mo
    # en RAM (FILE_UPLOAD_MAX_MEMORY_SIZE) et écrit le reste sur disque.
    client_max_body_size 200m;

    # Médias : servis directement par nginx depuis le bind lecture seule.
    # Les fichiers sont immuables (une carte re-scannée = nouveau fichier),
    # donc cache long. nginx gère nativement les requêtes Range (mp4).
    location /media/ {
        alias /media/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Tout le reste : gunicorn. Les statiques (/static/) restent servis par
    # WhiteNoise côté Django (compressés + empreintés).
    location / {
        proxy_pass http://lepostier_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
